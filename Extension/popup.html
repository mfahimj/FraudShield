<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FraudShield Dashboard</title>
    <style>
      :root {
        --bg-main: #0f0f12;
        --bg-card: #1e1e24;
        --text-main: #ffffff;
        --text-muted: #a0a0ab;
        --color-safe: #2ecc71;
        --color-risk: #e74c3c;
        --color-blue: #3498db;
        --border-subtle: rgba(255, 255, 255, 0.05);
      }

      body {
        width: 350px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        box-sizing: border-box;
      }

      .container {
        padding: 20px;
      }

      /* Header Brand Zone */
      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .header h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }

      .header p {
        color: var(--text-muted);
        font-size: 12px;
        margin: 4px 0 0 0;
      }

      /* Unified Card Layouts */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }

      .card h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
      }

      #site-url {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--color-blue);
        word-break: break-all;
      }

      /* Threat Assessment Hub */
      .risk-card {
        text-align: center;
        padding: 24px 16px;
        border-top: 4px solid var(--color-safe);
        transition: border-color 0.3s ease;
      }

      /* State change classes managed via JS */
      .risk-card.threat-mode {
        border-top-color: var(--color-risk);
      }

      .risk-badge {
        display: inline-block;
        background: rgba(46, 204, 113, 0.15);
        color: var(--color-safe);
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 12px;
        border: 1px solid rgba(46, 204, 113, 0.2);
      }

      .risk-card.threat-mode .risk-badge {
        background: rgba(231, 76, 60, 0.15);
        color: var(--color-risk);
        border: 1px solid rgba(231, 76, 60, 0.2);
      }

      .score h1 {
        margin: 12px 0 2px;
        font-size: 48px;
        font-weight: 800;
      }

      .score p {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
      }

      /* Diagnostic Indicators */
      .indicator-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .indicator-list li {
        margin-bottom: 8px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .indicator-list li:last-child {
        margin-bottom: 0;
      }

      /* Form Actions */
      button {
        width: 100%;
        border: none;
        padding: 14px;
        margin-top: 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      #scan-btn {
        background: var(--color-blue);
        color: white;
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
      }

      #scan-btn:hover {
        background: #2980b9;
      }

      #settings-btn {
        background: #2a2a35;
        color: var(--text-main);
        border: 1px solid var(--border-subtle);
      }

      #settings-btn:hover {
        background: #363645;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>🛡️ FraudShield</h2>
        <img src="logo.png" alt="Logo" style="width: 24px; height: 24px; vertical-align: middle;">
        <p>Random Forest AI Analysis</p>
      </div>

      <div class="card">
        <h3>Target Dimension</h3>
        <p id="site-url">Analyzing connection...</p>
      </div>

      <div id="risk-card-element" class="card risk-card">
        <h3>System Diagnostics</h3>
        <span id="badge-element" class="risk-badge">SCANNING</span>
        <div class="score">
          <h1 id="score-element">--</h1>
          <p id="verdict-label">Evaluating Threat Profile</p>
        </div>
      </div>

      <div class="card">
        <h3>Structural Indicators</h3>
        <ul class="indicator-list" id="indicators-box">
          <li>⏳ Waiting for AI execution feedback...</li>
        </ul>
      </div>

      <button id="scan-btn">Force Clear Cache</button>
      <button id="settings-btn">View Documentation</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
